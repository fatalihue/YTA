<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>YTA</title>
    <style>
      :root { --bg: #17181c; --card: #1d1f24; --border: rgba(255,255,255,.11); --text: #e6e7ea; --muted: #a8abb2;
        --accent: #2f6fe4; --accent-hover: #3b7bf0; --ok: #6fd69a; --err: #ff8a8a; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; width: 280px; padding: 16px; background: var(--bg); color: var(--text);
        font: 13px/18px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; }
      h1 { margin: 0 0 12px; font: 600 15px/20px 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
        display: flex; align-items: center; gap: 8px; }
      h1 img { width: 20px; height: 20px; }
      .status { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; color: var(--muted); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .on .dot { background: var(--ok); } .off .dot { background: var(--err); }
      p { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 16px; }
      button { width: 100%; height: 32px; border: 0; border-radius: 4px; background: var(--accent); color: #fff;
        font: 500 13px/18px inherit; font-family: inherit; cursor: pointer; }
      button:hover { background: var(--accent-hover); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .num { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <h1><img src="icons/32.png" alt="" /> YTA</h1>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">Procurando o YTA…</span></div>
    <p id="hint">Passe o mouse sobre um vídeo do YouTube ou do Instagram e use o botão “Baixar”. Clique direito em um link também funciona.</p>
    <button id="open">Abrir o YTA</button>
    <script src="popup.js"></script>
  </body>
</html>
